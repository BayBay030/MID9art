<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mr.Mid9｜網站建置中</title>
  <meta name="description" content="Mr.Mid9 官方網站建置中，近期上線。">
  <meta name="robots" content="noindex">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mid9arts.com/">
  <meta property="og:title" content="Mr.Mid9｜網站建置中">
  <meta property="og:description" content="Mr.Mid9 官方網站建置中，近期上線。">
  <meta property="og:image" content="https://mid9arts.com/images/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&family=Noto+Sans+TC:wght@300;400&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --muted: #888888;
      --hairline: #e8e8e8;
      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: "Inter", "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      --ease: cubic-bezier(.2, .7, .2, 1);
    }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      font-weight: 300;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .wrap {
      margin: auto 0;
      padding: 48px clamp(20px, 6vw, 56px) 36px;
      animation: rise 1.1s var(--ease) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    .brand {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(40px, 9vw, 88px);
      letter-spacing: .04em;
      line-height: 1.1;
      margin: 0;
    }

    .rule {
      width: 120px;
      height: 1px;
      margin: 40px auto;
      background: var(--hairline);
      position: relative;
      overflow: hidden;
    }
    .rule::after {
      content: "";
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 38%;
      background: var(--fg);
      animation: sweep 2.8s var(--ease) infinite;
    }
    @keyframes sweep {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(370%); }
    }

    .status {
      font-size: 12px;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 20px;
    }
    .line-zh {
      font-size: clamp(17px, 2.6vw, 21px);
      letter-spacing: .06em;
      margin: 0 0 6px;
    }
    .line-en {
      font-size: 13px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0;
    }

    .contact {
      margin-top: 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      letter-spacing: .06em;
    }
    .contact a {
      color: var(--fg);
      text-decoration: none;
      transition: opacity .2s var(--ease);
    }
    .contact a:hover { opacity: .55; }
    .contact__mail {
      border-bottom: 1px solid var(--hairline);
      padding-bottom: 2px;
    }
    .contact__ig {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
    }
    .contact__ig svg { display: block; }

    .foot {
      margin: 28px 0 0;
      font-size: 12px;
      letter-spacing: .04em;
      color: var(--muted);
    }

    /* 展場照：貼齊畫面底部，怪獸從下緣冒出來。
       白底跟網頁同色，所以看不到圖片邊框。
       寬度跟著螢幕高度算，讓文字＋圖剛好一個畫面放得下 */
    .hero {
      flex: none;
      width: min(100%, max(360px, calc((100vh - 560px) * 2.4)));
      width: min(100%, max(360px, calc((100svh - 560px) * 2.4)));
      overflow: hidden;
    }
    .hero img {
      display: block;
      width: 100%;
      height: auto;
      /* 原圖頂端有兩根尖刺被切平，上緣淡出把切口藏掉 */
      -webkit-mask-image: linear-gradient(to bottom, transparent, #000 8%);
      mask-image: linear-gradient(to bottom, transparent, #000 8%);
      animation: emerge 1.8s var(--ease) .35s both;
    }
    @keyframes emerge { from { opacity: 0; transform: translateY(12%); } to { opacity: 1; transform: none; } }

    /* 比較矮的電腦螢幕（多數筆電）：文字間距收緊，空間讓給圖 */
    @media (min-width: 600px) and (max-height: 820px) {
      .wrap { padding: 32px clamp(20px, 6vw, 56px) 24px; }
      .brand { font-size: clamp(40px, 9vw, 64px); }
      .rule { margin: 26px auto; }
      .status { margin-bottom: 14px; }
      .contact { margin-top: 32px; }
      .foot { margin-top: 16px; }
      .hero {
        width: min(100%, max(360px, calc((100vh - 440px) * 2.4)));
        width: min(100%, max(360px, calc((100svh - 440px) * 2.4)));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .wrap, .hero img { animation: none; }
      .rule::after { animation: none; width: 100%; background: var(--hairline); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="brand">Mr.Mid9</h1>

    <div class="rule" aria-hidden="true"></div>

    <p class="status">Under Construction</p>
    <p class="line-zh">網站建置中，近期上線。</p>
    <p class="line-en">The site is being built. Back soon.</p>

    <div class="contact">
      <a class="contact__mail" href="mailto:mid9.3d.2024@gmail.com">mid9.3d.2024@gmail.com</a>
      <a class="contact__ig" href="https://www.instagram.com/mid9artss/" target="_blank" rel="noopener" aria-label="Instagram @mid9artss">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4.2"/>
          <circle cx="17.3" cy="6.7" r=".9" fill="currentColor" stroke="none"/>
        </svg>
      </a>
    </div>

    <p class="foot">© <span id="year">2026</span> Mr.Mid9</p>
  </div>

  <div class="hero">
    <img src="images/hk-toy-fair-2400.jpg" width="2400" height="1000" alt="Mr.Mid9 香港玩具展作品" fetchpriority="high">
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
