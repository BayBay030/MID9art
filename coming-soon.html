<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mr.Mid9｜網站建置中</title>
  <meta name="description" content="Mr.Mid9 官方網站建置中，近期上線。">
  <meta name="robots" content="noindex">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mr.Mid9｜網站建置中">
  <meta property="og:description" content="Mr.Mid9 官方網站建置中，近期上線。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&family=Noto+Sans+TC:wght@300;400&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --muted: #888888;
      --hairline: #e8e8e8;
      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: "Inter", "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      --ease: cubic-bezier(.2, .7, .2, 1);
    }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      font-weight: 300;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px clamp(20px, 6vw, 56px);
      text-align: center;
    }
    .wrap { animation: rise 1.1s var(--ease) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    .brand {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(40px, 9vw, 88px);
      letter-spacing: .04em;
      line-height: 1.1;
      margin: 0;
    }

    .rule {
      width: 120px;
      height: 1px;
      margin: 40px auto;
      background: var(--hairline);
      position: relative;
      overflow: hidden;
    }
    .rule::after {
      content: "";
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 38%;
      background: var(--fg);
      animation: sweep 2.8s var(--ease) infinite;
    }
    @keyframes sweep {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(370%); }
    }

    .status {
      font-size: 12px;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 20px;
    }
    .line-zh {
      font-size: clamp(17px, 2.6vw, 21px);
      letter-spacing: .06em;
      margin: 0 0 6px;
    }
    .line-en {
      font-size: 13px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0;
    }

    .contact {
      margin-top: 56px;
      font-size: 13px;
      letter-spacing: .06em;
    }
    .contact a {
      color: var(--fg);
      text-decoration: none;
      border-bottom: 1px solid var(--hairline);
      padding-bottom: 2px;
      transition: opacity .2s var(--ease);
    }
    .contact a:hover { opacity: .55; }

    .foot {
      position: absolute;
      bottom: 28px;
      left: 0; right: 0;
      font-size: 12px;
      letter-spacing: .04em;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      .wrap { animation: none; }
      .rule::after { animation: none; width: 100%; background: var(--hairline); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="brand">Mr.Mid9</h1>

    <div class="rule" aria-hidden="true"></div>

    <p class="status">Under Construction</p>
    <p class="line-zh">網站建置中，近期上線。</p>
    <p class="line-en">The site is being built. Back soon.</p>

    <p class="contact">
      <a href="mailto:hello@example.com">hello@example.com</a>
    </p>
  </div>

  <p class="foot">© <span id="year">2026</span> Mr.Mid9</p>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
